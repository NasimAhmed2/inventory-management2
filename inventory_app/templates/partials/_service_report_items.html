<div class="card shadow-sm mb-4">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">

            <i class="fas fa-microchip me-2"></i>

            Required Spare Parts

        </h5>

        <button
            type="button"
            class="btn btn-success btn-sm"
            id="addItemRow"
        >

            <i class="fas fa-plus"></i>

            Add Item

        </button>

    </div>

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-bordered mb-0" id="itemsTable">

                <thead class="table-light">

                <tr>

                    <th width="15%">Category</th>

                    <th width="28%">Product</th>

                    <th width="10%">Available</th>

                    <th width="8%">Qty</th>

                    <th width="12%">Rate</th>

                    <th width="12%">Total</th>

                    <th width="15%">Remarks</th>

                    <th width="5%"></th>

                </tr>

                </thead>

                <tbody id="itemRows">

                {% if report %}

                    {% for item in report.items.all %}

                    <tr>

                        <td>

                            <select
                                name="category[]"
                                class="form-select category-select"
                            >

                                <option value="">Select</option>

                                {% for category in product_categories %}

                                <option
                                    value="{{ category }}"
                                    {% if category == item.product.category %}selected{% endif %}
                                >

                                    {{ category }}

                                </option>

                                {% endfor %}

                            </select>

                        </td>

                        <td>

                            <select
                                name="product[]"
                                class="form-select product-select"
                            >

                                <option value="{{ item.product.id }}">

                                    {{ item.product.item_name }}

                                </option>

                            </select>

                        </td>

                        <td>

                            <input
                                type="text"
                                class="form-control stock-display"
                                value="{{ item.product.stock.quantity_available }}"
                                readonly
                            >

                        </td>

                        <td>

                            <input
                                type="number"
                                min="1"
                                name="quantity[]"
                                class="form-control quantity"
                                value="{{ item.quantity }}"
                            >

                        </td>

                        <td>

                            <input
                                type="number"
                                step="0.01"
                                name="rate[]"
                                class="form-control rate"
                                value="{{ item.estimated_rate }}"
                            >

                        </td>

                        <td>

                            <input
                                type="text"
                                class="form-control line-total"
                                value="{{ item.line_total }}"
                                readonly
                            >

                        </td>

                        <td>

                            <input
                                type="text"
                                name="item_remarks[]"
                                class="form-control"
                                value="{{ item.remarks }}"
                            >

                        </td>

                        <td class="text-center">

                            <button
                                type="button"
                                class="btn btn-danger btn-sm removeRow"
                            >

                                <i class="fas fa-times"></i>

                            </button>

                        </td>

                    </tr>

                    {% endfor %}

                {% endif %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Hidden Product Data -->

{{ products_json|json_script:"products-data" }}
