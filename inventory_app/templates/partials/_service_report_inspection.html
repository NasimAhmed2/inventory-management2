<div class="card shadow-sm mb-4">

    <div class="card-header bg-warning">

        <h5 class="mb-0">

            <i class="fas fa-tools me-2"></i>

            Inspection Report

        </h5>

    </div>

    <div class="card-body">

        <div class="mb-3">

            <label class="form-label">

                Inspection Notes

            </label>

            <textarea
                class="form-control"
                name="inspection_notes"
                rows="4"
            >{% if report %}{{ report.inspection_notes }}{% endif %}</textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Problem Found

            </label>

            <textarea
                class="form-control"
                name="problem_found"
                rows="4"
            >{% if report %}{{ report.problem_found }}{% endif %}</textarea>

        </div>

        <div>

            <label class="form-label">

                Repair Solution

            </label>

            <textarea
                class="form-control"
                name="repair_solution"
                rows="4"
            >{% if report %}{{ report.repair_solution }}{% endif %}</textarea>

        </div>

    </div>

</div>
